services:
  panhub:
    build: .
    container_name: panhub
    restart: unless-stopped
    ports:
      # 对外 14000，容器内 nginx 监听 80（静态 SPA 镜像，见 Dockerfile）
      - "14000:80"
    # 资源上限：OOM 只杀容器（restart 拉起），不拖垮 2GB 宿主机
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查（与 Dockerfile 内置 HEALTHCHECK 同源：首页可达即健康）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
